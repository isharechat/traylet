name: macOS build and package

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "${TAG_NAME#v}" = "$(cat VERSION)"

      - name: Build and test
        run: |
          swift --version
          swift test --no-parallel --skip EditingColorWellTests
          python3 -m unittest discover -s Tests/TrayletToolingTests

      - name: Package unsigned app
        if: github.event_name != 'pull_request'
        run: scripts/package-ci.sh

      - name: Upload package artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Traylet-macos-arm64-build-${{ github.run_number }}
          path: |
            build/ci-artifacts/Traylet-macos-arm64-*/*.zip
            build/ci-artifacts/Traylet-macos-arm64-*/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: test-and-package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@v5
        with:
          name: Traylet-macos-arm64-build-${{ github.run_number }}
          path: release-assets

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release already exists for $TAG_NAME; refusing to replace it."
            exit 1
          fi
          gh release create "$TAG_NAME" \
            release-assets/Traylet-macos-arm64-*/*.zip \
            release-assets/Traylet-macos-arm64-*/*.sha256 \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Traylet $TAG_NAME"

name: macOS build and package

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "${TAG_NAME#v}" = "$(cat VERSION)"

      - name: Prepare Developer ID signing and notarization
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          NOTARY_PRIVATE_KEY_P8: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY_P8 }}
        run: |
          if [[ -z "$CERTIFICATE_P12_BASE64" || -z "$CERTIFICATE_P12_PASSWORD" || -z "$APPLE_TEAM_ID" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" || -z "$NOTARY_PRIVATE_KEY_P8" ]]; then
            echo "Missing Developer ID / notarization repository secrets; refusing to build a public release." >&2
            exit 1
          fi
          keychain_path="$RUNNER_TEMP/traylet-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="$RUNNER_TEMP/traylet-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          python3 -c 'import base64,os,sys; open(sys.argv[1], "wb").write(base64.b64decode(os.environ["CERTIFICATE_P12_BASE64"]))' "$certificate_path"
          python3 -c 'import os,sys; open(sys.argv[1], "w").write(os.environ["NOTARY_PRIVATE_KEY_P8"])' "$notary_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/^ *[0-9][0-9]*) .* "\(Developer ID Application:.*\)"$/\1/p' | head -n 1)"
          if [[ -z "$identity" || "$identity" != *"$APPLE_TEAM_ID"* ]]; then
            echo "No Developer ID Application identity for the configured Apple team was imported." >&2
            exit 1
          fi
          echo "TRAYLET_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "TRAYLET_NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"
          echo "TRAYLET_NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "TRAYLET_NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          swift --version
          swift test --no-parallel --skip EditingColorWellTests
          python3 -m unittest discover -s Tests/TrayletToolingTests

      - name: Package app
        if: github.event_name != 'pull_request'
        run: scripts/package-ci.sh

      - name: Upload package artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Traylet-macos-arm64-build-${{ github.run_number }}
          path: |
            build/ci-artifacts/Traylet-macos-arm64-*/*.zip
            build/ci-artifacts/Traylet-macos-arm64-*/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: test-and-package
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@v5
        with:
          name: Traylet-macos-arm64-build-${{ github.run_number }}
          path: release-assets

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release already exists for $TAG_NAME; refusing to replace it."
            exit 1
          fi
          gh release create "$TAG_NAME" \
            release-assets/Traylet-macos-arm64-*/*.zip \
            release-assets/Traylet-macos-arm64-*/*.sha256 \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Traylet $TAG_NAME"
